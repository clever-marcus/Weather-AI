name: Weather API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false  # Continue even if one job fails
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Debug - Check environment variables
      run: |
        echo "Checking if WEATHER_API_KEY is set..."
        if [ -z "$WEATHER_API_KEY" ]; then
          echo "⚠️ WEATHER_API_KEY is not set!"
          echo "Please add it as a GitHub Secret: Settings > Secrets and variables > Actions"
        else
          echo "✅ WEATHER_API_KEY is set (length: ${#WEATHER_API_KEY})"
        fi
      env:
        WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
    
    - name: Run tests and generate report
      env:
        WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        BASE_URL: https://api.weatherai.io/mcp
      run: |
        if [ -z "$WEATHER_API_KEY" ]; then
          echo "❌ WEATHER_API_KEY is missing! Skipping tests..."
          exit 1
        fi
        pytest --html=report.html --self-contained-html -v
    
    - name: Upload test report
      if: always()  # Upload even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: test-report-python-${{ matrix.python-version }}
        path: report.html
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: .pytest_cache/